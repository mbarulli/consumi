<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumi — report</title>
<style>
  :root{ color-scheme: light; --bg:#f7f8fa; --card:#ffffff; --ink:#1c2430; --muted:#5b6572; --line:#e2e5ea; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:680px;margin:0 auto;padding:60px 20px;}
  h1{font-size:22px;margin:0 0 6px;}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 28px;}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;text-decoration:none;color:var(--ink);}
  a.card:hover{border-color:#2f6fed;}
  a.card .t{font-weight:600;font-size:15px;}
  a.card .d{color:var(--muted);font-size:13px;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Report consumi</h1>
  <p class="sub">Analisi periodiche dei consumi domestici.</p>
  <a class="card" href="./gas/">
    <div class="t">Gas — andamento storico</div>
    <div class="d">Consumo (Smc) e ripartizione dei costi (materia gas vs. accessori), 2020–2026.</div>
  </a>
</div>
</body>
</html>
